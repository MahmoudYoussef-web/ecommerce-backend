spring:
  application:
    name: ecommerce-backend

  profiles:
    default: dev

  # Optional local secrets file (gitignored). Values here override profile files.
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Empty default = noauth, for bare local dev Redis. The docker-compose
      # stack sets REDIS_PASSWORD and starts Redis with --requirepass so the
      # cache is never exposed unauthenticated on a mapped host port.
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  jpa:
    show-sql: false
    # Phase 6: OSIV is OFF — database connections are released at transaction
    # end instead of being held through rendering. All lazy-loading boundaries
    # are explicit service transactions (Phase 4/6 audits).
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    # Existing pre-Flyway databases are baselined at V1 (schema created by
    # Hibernate previously); fresh databases are migrated from scratch via
    # db/migration/V1__baseline.sql.
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

server:
  port: 8080

logging:
  level:
    org.springframework: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: OFF

# ===============================
# JWT (expiration is env-neutral; secret lives in the active profile)
# ===============================
auth:
  jwt:
    expiration: 86400000

# ===============================
# SWAGGER / OPENAPI
# Disabled by default so production never exposes API docs anonymously.
# The dev profile explicitly re-enables it (application-dev.yml).
# ===============================
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ===============================
# RATE LIMITING (Bucket4j, per-IP)
# ===============================
app:
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    capacity: ${APP_RATE_LIMIT_CAPACITY:10}
    refill-per-minute: ${APP_RATE_LIMIT_REFILL_PER_MINUTE:20}
    # Only enable when the app runs behind a trusted reverse proxy that
    # overwrites X-Forwarded-For. When false (default), client IPs come from
    # the TCP connection and forwarded headers are IGNORED (anti-spoofing).
    trust-proxy: ${APP_RATE_LIMIT_TRUST_PROXY:false}

  # When false (dev default), emails are logged instead of sent over SMTP.
  mail:
    enabled: ${APP_MAIL_ENABLED:false}

  # Product image uploads land here and are served at /uploads/**.
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}

  # Known admin/customer dev accounts are FAIL-CLOSED: not seeded unless
  # explicitly enabled. Only the dev profile turns them on, with a dev-only
  # password default. Prod must never seed them.
  seed:
    default-users:
      enabled: ${APP_SEED_DEFAULT_USERS_ENABLED:false}
      password: ${APP_SEED_DEFAULT_USERS_PASSWORD:}

# ===============================
# ACTUATOR
# Only health is exposed over the web. Anything not listed here is not
# served at all; SecurityConfig additionally restricts /actuator/** beyond
# health to ADMIN as defense-in-depth.
# ===============================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    # A broken SMTP config must surface as unhealthy (fails loudly) instead of
    # silently failing to send verification/password emails. The dev profile
    # overrides this back to false because dev logs mail and uses a placeholder
    # SMTP host (see application-dev.yml).
    mail:
      enabled: true
