# ===============================
# PROD PROFILE
# Fail-fast: no placeholder defaults. Missing required env vars abort startup.
# ===============================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration: ${AUTH_JWT_EXPIRATION:86400000}

stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET}

app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${APP_FRONTEND_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  cookie:
    same-site: ${APP_COOKIE_SAMESITE:None}
    secure: ${APP_COOKIE_SECURE:true}
  dev:
    auto-verify-email: ${APP_DEV_AUTO_VERIFY_EMAIL:false}
  currency:
    egp-per-usd: ${APP_CURRENCY_EGP_PER_USD:48.75}
